name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一個分支有新的 push 時，取消還在跑的舊工作。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下檔案未經 gofmt 排版（執行 task format 修正）："
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -o bin/server ./cmd/server

  web:
    name: web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: lint
        run: npm run lint
      - name: format check
        run: npm run format:check
      - name: build
        run: npm run build

  proto:
    name: proto (lint + codegen up to date)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: buf lint
        run: npx buf lint ../proto
      - name: buf format
        run: npx buf format -d --exit-code ../proto
      - name: buf generate
        run: npx buf generate ../proto --template ../proto/buf.gen.yaml
      - name: generated code is committed
        run: |
          if [ -n "$(git status --porcelain -- ../server/internal/pb src/gen)" ]; then
            echo "::error::產生的程式碼與 .proto 不一致，請執行 task proto 並提交結果："
            git status --porcelain -- ../server/internal/pb src/gen
            git diff -- ../server/internal/pb src/gen | head -50
            exit 1
          fi

  docker:
    name: docker (compose build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: docker compose build
        run: docker compose build
