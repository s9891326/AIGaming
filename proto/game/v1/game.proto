syntax = "proto3";

// game.v1 是瀏覽器與遊戲伺服器之間 WebSocket 傳輸的協議。
// 每個 WebSocket binary frame 剛好是一個 ClientMessage（客戶端 → 伺服器）
// 或 ServerMessage（伺服器 → 客戶端），用 oneof 區分訊息種類。
package game.v1;

option go_package = "aigaming/server/internal/pb/game/v1;gamev1";

// ClientMessage 是客戶端送給伺服器的信封。
message ClientMessage {
  oneof payload {
    Ping ping = 1;
    JoinRequest join = 2;
    PlayerInput input = 3;
  }
}

// ServerMessage 是伺服器送給客戶端的信封。
message ServerMessage {
  oneof payload {
    Welcome welcome = 1;
    Pong pong = 2;
    JoinAccepted join_accepted = 3;
    WorldSnapshot snapshot = 4;
    GameOver game_over = 5;
  }
}

// Welcome 在連線建立後由伺服器立即送出。
message Welcome {
  // 這條連線在伺服器上的識別碼，方便對照日誌。
  string connection_id = 1;
  // 伺服器版本（APP_VERSION）。
  string server_version = 2;
}

// Ping 由客戶端定期送出，用來量測往返延遲（RTT）。
message Ping {
  // 客戶端送出時的時間（毫秒）。伺服器原封不動放回 Pong，
  // 客戶端收到後用「現在 - client_time_ms」得到 RTT，不需要兩邊時鐘同步。
  double client_time_ms = 1;
}

// Pong 是伺服器對 Ping 的回應。
message Pong {
  // 原封不動帶回 Ping.client_time_ms。
  double client_time_ms = 1;
  // 伺服器處理時的 Unix 時間（毫秒），之後可用來估算時鐘偏移。
  double server_time_ms = 2;
}

// JoinRequest 請求加入遊戲。每條連線最多只會有一個角色，重複送出會被忽略。
message JoinRequest {}

// JoinAccepted 回應 JoinRequest，告訴客戶端自己的角色與世界的基本參數。
// 伺服器保證在任何包含這個角色的 WorldSnapshot 之前送出。
message JoinAccepted {
  // 自己的角色 ID，用來在快照中找出自己。
  uint32 player_id = 1;
  // 世界大小（遊戲單位），座標範圍為 [0, width] × [0, height]。
  float world_width = 2;
  float world_height = 3;
  // 伺服器每秒模擬幾次（tick）。
  uint32 tick_rate = 4;
  // 角色半徑（遊戲單位），用於繪製與客戶端預測的邊界計算。
  float player_radius = 5;
  // 角色移動速度（單位 / 秒），客戶端預測用，必須與伺服器算法一致。
  float player_speed = 6;
  // 敵人半徑（遊戲單位），用於繪製。
  float enemy_radius = 7;
}

// PlayerInput 代表「往這個方向移動一個 tick（1 / tick_rate 秒）」。
// 移動時客戶端每個 tick 送一筆，不動時不送。伺服器收到就套用，
// 並在快照中回報 last_input_seq；客戶端從伺服器位置重播尚未確認的輸入（預測 / 校正）。
// 伺服器以時間預算限制每秒可套用的輸入數，超出的會被丟棄（防止加速作弊）。
message PlayerInput {
  // 遞增的輸入序號（從 1 開始）。
  uint32 seq = 1;
  // 移動方向，各分量在 [-1, 1]；長度超過 1 時伺服器會正規化（斜向不會比較快）。
  float move_x = 2;
  float move_y = 3;
}

// WorldSnapshot 是伺服器每個 tick 廣播的世界狀態。
message WorldSnapshot {
  // 第幾個 tick（從伺服器啟動起算）。
  uint32 tick = 1;
  // 產生快照時伺服器的 Unix 時間（毫秒）。
  double server_time_ms = 2;
  repeated PlayerState players = 3;
  repeated EnemyState enemies = 4;
}

// PlayerState 是快照中單一角色的狀態。
message PlayerState {
  uint32 id = 1;
  // 角色中心座標（遊戲單位）。
  float x = 2;
  float y = 3;
  // 最後一個已套用的 PlayerInput.seq。
  uint32 last_input_seq = 4;
  // 目前血量與上限。
  uint32 hp = 5;
  uint32 max_hp = 6;
}

// EnemyState 是快照中單一敵人的狀態。
message EnemyState {
  uint32 id = 1;
  float x = 2;
  float y = 3;
}

// GameOver 在自己的角色血量歸零時送出。之後不再收到快照，
// 想再玩就重新送 JoinRequest（會以新角色加入）。
message GameOver {
  // 這個角色存活的時間（毫秒）。
  uint32 survived_ms = 1;
  // 擊殺數。
  uint32 kills = 2;
}
